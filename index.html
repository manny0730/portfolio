<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — Manuel Toledo Portfolio</title>
    <link rel="canonical" href="https://mtoledo.pages.dev/" />
    <meta http-equiv="refresh" content="0; url=https://mtoledo.pages.dev/" />
    <script>
      (function () {
        var targetDomain = 'https://mtoledo.pages.dev';
        var hash = window.location.hash || '';
        var search = window.location.search || '';

        // 1. Convert old HashRouter links (e.g., /portfolio/#/AstraLens -> https://mtoledo.pages.dev/AstraLens)
        if (hash.indexOf('#/') === 0) {
          var routePath = hash.substring(1); // Turns "#/AstraLens" into "/AstraLens"
          window.location.replace(targetDomain + routePath + search);
          return;
        }

        // 2. Otherwise strip "/portfolio" from pathname and keep any section hash (e.g., #xr)
        var subPath = window.location.pathname.replace(/^\/portfolio\/?/, '/');
        window.location.replace(targetDomain + subPath + search + hash);
      })();
    </script>
  </head>
  <body style="background:#121110;color:#f5f2eb;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
    <p>Redirecting to <a href="https://mtoledo.pages.dev/" style="color:#e2876b;">mtoledo.pages.dev</a>&hellip;</p>
  </body>
</html>
