<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manuel Toledo | Portfolio</title>

    <!-- Automatic Redirect ONLY when visited via old GitHub Pages domain -->
    <script>
      (function () {
        if (window.location.hostname === 'manny0730.github.io') {
          var targetDomain = 'https://mtoledo.pages.dev';
          var hash = window.location.hash || '';
          var search = window.location.search || '';

          // 1. Convert old HashRouter links (e.g., /portfolio/#/AstraLens -> https://mtoledo.pages.dev/AstraLens)
          if (hash.indexOf('#/') === 0) {
            var routePath = hash.substring(1); // Turns "#/AstraLens" into "/AstraLens"
            window.location.replace(targetDomain + routePath + search);
            return;
          }

          // 2. Otherwise strip "/portfolio" from pathname and keep any section hash (e.g., #xr)
          var subPath = window.location.pathname.replace(/^\/portfolio\/?/, '/');
          window.location.replace(targetDomain + subPath + search + hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
